AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Foundation stack — GitHub OIDC provider and a single least-privilege IAM
  role, assumed by GitHub Actions to deploy the serverless-task-manager-system
  SAM app (Cognito, API Gateway, Lambda, DynamoDB, SNS, SQS). Deploy this
  BEFORE template.yaml.

Parameters:
  ProjectName:
    Type: String
    Default: bem17
  GitHubOrg:
    Type: String
    Description: GitHub organisation or username that owns the app repository (e.g. nlenjibi)
  GitHubRepo:
    Type: String
    Description: GitHub repository name (e.g. serverless-task-manager-system)
  AppStackName:
    Type: String
    Default: serverless-todo-app
    Description: CloudFormation stack name used by `sam deploy` for template.yaml (see samconfig.toml stack_name)
  DevArtifactsBucketName:
    Type: String
    Default: bem-sam-dev-artifacts
  ProdArtifactsBucketName:
    Type: String
    Default: bem-sam-prod-artifacts

Resources:

  # ── GitHub OIDC Identity Provider ─────────────────────────────
  # Lets GitHub Actions / Git Sync exchange a short-lived OIDC token for AWS
  # credentials via sts:AssumeRoleWithWebIdentity — no long-lived access keys.
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-github-oidc-provider"
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── SAM Deployment Artifacts Buckets ───────────────────────────
  # sam deploy uploads packaged templates/code here before creating the
  # dev/prod CloudFormation stacks.
  DevArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref DevArtifactsBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  ProdArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ProdArtifactsBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── GitHub Actions IAM Role
  # Trusted by this GitHub repo, used by the deploy.yml workflow to
  # sam-deploy template.yaml. Since sam/cloudformation deploy provisions
  # resources using the caller's own credentials (no separate CFN service
  # role is configured in samconfig.toml), this role needs direct create/
  # update/delete permissions on every resource type template.yaml defines:
  # Cognito User Pool, API Gateway, Lambda (+ IAM exec roles), DynamoDB
  # (+ Streams), SNS, SQS FIFO — each scoped to the app stack's naming
  # convention (${AppStackName}-*) wherever the API allows.
  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-github-actions-role"
      Description: Assumed by GitHub Actions via OIDC to deploy the serverless-todo-app SAM stack
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Allows push-to-main deploys plus pull_request runs (the validate job,
                # and CloudFormation Git Sync's own auto-created aws-sync-main-* PRs).
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubOrg}/${GitHubRepo}:pull_request"
      Policies:
        - PolicyName: cloudformation-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormationDeploy
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ValidateTemplate
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}-*/*"
              - Sid: SamTransformAccess
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31"
        - PolicyName: dynamodb-table-lifecycle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoDbTableLifecycle
                Effect: Allow
                Action:
                  - dynamodb:CreateTable
                  - dynamodb:DeleteTable
                  - dynamodb:DescribeTable
                  - dynamodb:UpdateTable
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                  - dynamodb:ListTagsOfResource
                  - dynamodb:DescribeTimeToLive
                  - dynamodb:UpdateTimeToLive
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:UpdateContinuousBackups
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-Tasks"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AppStackName}-Tasks/stream/*"
        - PolicyName: cognito-user-pool-lifecycle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CognitoUserPoolLifecycle
                Effect: Allow
                Action:
                  - cognito-idp:CreateUserPool
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                  - cognito-idp:ListTagsForResource
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:DescribeUserPoolClient
                Resource:
                  - !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
        - PolicyName: apigateway-lifecycle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ApiGatewayLifecycle
                Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:POST
                  - apigateway:PUT
                  - apigateway:PATCH
                  - apigateway:DELETE
                Resource:
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis/*"
                  # API Gateway tagging (e.g. tagging TodoApiStage) is checked against a
                  # /tags/{url-encoded-resource-arn} path, not the /restapis/* resource itself
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/tags/*"
        - PolicyName: sns-topic-lifecycle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SnsTopicLifecycle
                Effect: Allow
                Action:
                  - sns:CreateTopic
                  - sns:DeleteTopic
                  - sns:GetTopicAttributes
                  - sns:SetTopicAttributes
                  - sns:TagResource
                  - sns:UntagResource
                  - sns:ListTagsForResource
                Resource:
                  - !Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:${AppStackName}-TaskNotifications"
        - PolicyName: sqs-queue-lifecycle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SqsQueueLifecycle
                Effect: Allow
                Action:
                  - sqs:CreateQueue
                  - sqs:DeleteQueue
                  - sqs:GetQueueAttributes
                  - sqs:SetQueueAttributes
                  - sqs:TagQueue
                  - sqs:UntagQueue
                  - sqs:ListQueueTags
                Resource:
                  - !Sub "arn:aws:sqs:${AWS::Region}:${AWS::AccountId}:${AppStackName}-Cancellation.fifo"
        - PolicyName: lambda-function-lifecycle
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LambdaFunctionLifecycle
                Effect: Allow
                Action:
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:ListVersionsByFunction
                  - lambda:PublishVersion
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:ListTags
                  - lambda:AddPermission
                  - lambda:RemovePermission
                  - lambda:GetPolicy
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${AppStackName}-*"
              - Sid: LambdaPowertoolsLayerAccess
                Effect: Allow
                Action:
                  - lambda:GetLayerVersion
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:017000801446:layer:AWSLambdaPowertoolsPythonV3-python312-x86_64:*"
              - Sid: LambdaEventSourceMappings
                Effect: Allow
                # These Lambda APIs do not support resource-level permissions per AWS's
                # IAM action reference — they must be called with Resource: "*".
                Action:
                  - lambda:CreateEventSourceMapping
                  - lambda:DeleteEventSourceMapping
                  - lambda:UpdateEventSourceMapping
                  - lambda:GetEventSourceMapping
                  - lambda:ListEventSourceMappings
                Resource: "*"
        - PolicyName: iam-role-management
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LambdaAndSchedulerExecRoleLifecycle
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
              - Sid: PassLambdaExecRole
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${AppStackName}-*"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
        - PolicyName: sam-artifacts-buckets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SamArtifactsBuckets
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${DevArtifactsBucketName}"
                  - !Sub "arn:aws:s3:::${DevArtifactsBucketName}/*"
                  - !Sub "arn:aws:s3:::${ProdArtifactsBucketName}"
                  - !Sub "arn:aws:s3:::${ProdArtifactsBucketName}/*"
      Tags:
        - Key: Name
          Value: !Sub "${ProjectName}-github-actions-role"
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

Outputs:
  GitHubActionsRoleArn:
    Value: !GetAtt GitHubActionsRole.Arn
    Export:
      Name: !Sub "${ProjectName}-GitHubActionsRoleArn"

  OidcProviderArn:
    Value: !Ref GithubOidcProvider
    Export:
      Name: !Sub "${ProjectName}-OidcProviderArn"
